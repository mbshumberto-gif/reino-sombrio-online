name: Validate RPG
on:
  pull_request:
  push:
    branches: [main, feature/rpg-completo-fundacao]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check public/game.js
      - run: npm test
