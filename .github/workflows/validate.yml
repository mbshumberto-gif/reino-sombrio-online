name: Validate RPG
on:
  pull_request:
  push:
    branches: [main, feature/**]
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eldoria
          POSTGRES_PASSWORD: eldoria_test
          POSTGRES_DB: eldoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eldoria -d eldoria_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ELDORIA_TEST_DATABASE_URL: postgres://eldoria:eldoria_test@127.0.0.1:5432/eldoria_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
